  <text x="580" y="200" class="sub">auth · per-user token limits</text>

  <text x="100" y="315" class="title">📥 Message Queue</text>
  <text x="100" y="335" class="sub">new session / background task requests</text>
  <text x="100" y="351" class="sub">absorbs bursts, decouples intake</text>
  <text x="100" y="367" class="sub">from orchestrator capacity</text>

  <text x="100" y="505" class="title">👷 Session Worker Pool</text>
  <text x="100" y="525" class="sub">consumes queued requests</text>

  <text x="520" y="330" class="note">each loop iteration (call LLM, get tool call, execute, get</text>
  <text x="520" y="343" class="note">result) is persisted — crash on step 30, resume at step 30</text>
